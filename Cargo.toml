[package]
name = "greenlens"
version = "0.1.0"
edition = "2021"
description = "Plant disease classification from leaf images"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.37"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
opt-level = 2
